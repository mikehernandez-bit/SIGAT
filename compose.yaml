name: siget-uns
services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: siget-uns:local
    init: true
    ports:
      - "127.0.0.1:${SIGET_PORT:-3000}:3000"
    volumes:
      - datos-siget:/app/.wrangler/state
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.mjs"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    stop_grace_period: 20s
volumes:
  datos-siget:
